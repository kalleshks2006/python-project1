<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101923">
  <title>Iron Horizon: Battlefield</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="hud" aria-label="Game information">
      <div class="brand"><span>IRON</span> HORIZON <small>• FRONTLINE</small></div>
      <div class="stats"><span>WAVE <b id="wave">1</b></span><span>SCORE <b id="score">0000</b></span></div>
    </header>
    <div class="game-wrap">
      <canvas id="game" aria-label="Battlefield shooting game"></canvas>
      <div class="crosshair" id="crosshair"></div>
      <section class="start-card" id="startCard">
        <p class="eyebrow">MISSION 01 / DUSTLINE</p>
        <h1>Hold the line.</h1>
        <p>Clear hostile scouts before they reach your position.</p>
        <button id="startButton">START MISSION</button>
        <small>Desktop: mouse to aim, click / Space to fire<br>Mobile: drag right side to aim, tap FIRE to shoot</small>
      </section>
      <section class="end-card hidden" id="endCard">
        <p class="eyebrow">MISSION REPORT</p><h1 id="endTitle">Mission complete</h1>
        <p id="endText"></p><button id="restartButton">PLAY AGAIN</button>
      </section>
      <div class="vignette"></div>
    </div>
    <footer class="controls">
      <div class="health"><span>ARMOR</span><div><i id="healthBar"></i></div><b id="healthText">100</b></div>
      <div class="mobile-controls">
        <button class="round-btn" id="pauseButton" aria-label="Pause game">Ⅱ</button>
        <button class="fire-btn" id="fireButton" aria-label="Fire weapon">FIRE</button>
      </div>
      <p class="tip">Aim • Fire • Survive</p>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
